# Ánima I en una laptop.
#
# Un solo servicio: la web construida y la API salen por el mismo puerto, y el
# CLI de Codex corre adentro del contenedor.
#
# Pensado para convivir con otros proyectos en la misma máquina: nombre de
# proyecto propio, puerto configurable, y una red y un volumen que no se
# comparten con nadie. Nada de esto toca el Docker del resto.
#
# ═══ LA CANILLA VIENE CERRADA (ADR 0089) ═══════════════════════════════════
#
# De fábrica esto NO presta ninguna cuenta: `ANIMA_CLI_LOCAL` viene en 0 y ni
# siquiera se monta el `~/.codex` de la máquina. Quien entre y quiera mente real
# enchufa su propia API OpenAI-compatible desde el navegador, y esa llave nunca
# pasa por acá.
#
# Para volver al modo de antes —tu cuenta, en tu máquina, para vos— van las dos
# cosas juntas en el `.env`: `ANIMA_CLI_LOCAL=1` y `ANIMA_CODEX_SEED` apuntando
# a la carpeta que dejó `codex login`. Una sin la otra no sirve: sin semilla el
# CLI arranca sin sesión, y sin el flag el puente no se construye.
#
# **No lo enciendas en algo publicado.** El CLI corre del lado del servidor, así
# que el que paga sos vos y el que decide es cualquiera con la URL.

# Explícito para que el nombre no dependa de cómo se llame la carpeta: así los
# recursos son siempre `anima_*` y no chocan con los de otro proyecto.
name: anima

services:
  anima:
    build: .
    image: anima:1
    container_name: anima
    # El de afuera se cambia con ANIMA_PORT si 8787 ya está tomado; el de
    # adentro es fijo. Abierto a toda la red a propósito: la idea es que otros
    # entren desde sus dispositivos. Para dejarlo solo en esta máquina, poné
    # ANIMA_BIND=127.0.0.1 en el .env.
    ports:
      - '${ANIMA_BIND:-0.0.0.0}:${ANIMA_PORT:-8787}:8787'
    environment:
      # ¿Se pueden usar los CLI de ESTA máquina (Codex, Claude)? En 0, no se
      # construye ningún puente y `/ai/*` contesta 503 con la salida: traé tu
      # propia API. Ver el encabezado antes de poner 1.
      ANIMA_CLI_LOCAL: '${ANIMA_CLI_LOCAL:-0}'
      # Las dos de abajo solo hacen algo con ANIMA_CLI_LOCAL=1.
      # Bajo por defecto, para cuidar la cuota. minimal | low | medium | high | xhigh
      ANIMA_CODEX_EFFORT: '${ANIMA_CODEX_EFFORT:-low}'
      # Vacío = el default de la cuenta («Automático»), que es lo recomendado:
      # el `config.toml` de la máquina no viaja, así que acá no hay modelo
      # elegido salvo que lo pongas vos.
      ANIMA_CODEX_MODEL: '${ANIMA_CODEX_MODEL:-}'
      # Ánima II vive en `/v2` del mismo dominio, servida por este mismo
      # proceso; su depósito entra por acá y sale publicado en /v2/deposito.
      ANIMA_V2_DEPOSITO: 'http://anima-ii:5190'
    depends_on:
      anima-ii:
        condition: service_started
    volumes:
      # Único estado: base SQLite y el CODEX_HOME que usa el contenedor.
      - datos:/datos
      # La sesión de Codex de la máquina, de solo lectura. El contenedor la
      # copia una vez y después vive de su copia: nada de lo que pase adentro
      # puede tocar tus credenciales reales.
      # Con la canilla cerrada esto monta una carpeta VACÍA del repo: el
      # contenedor no tiene forma de llegar a tu cuenta ni por error. Apuntalo
      # a tu `~/.codex` (en el `.env`) solo si además ponés ANIMA_CLI_LOCAL=1.
      - '${ANIMA_CODEX_SEED:-./docker/sin-semilla}:/semilla/codex:ro'
    restart: unless-stopped
    # Techo modesto y a propósito: esto es un Fastify y un CLI, no tiene por
    # qué pelearle la memoria a lo demás que corra en la máquina.
    deploy:
      resources:
        limits:
          memory: 1536M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── El depósito de sprites de Ánima II ───────────────────────────────────
  #
  # No publica puerto: la única forma de llegarle es por `/v2/deposito`, que
  # atiende el servicio de arriba. Tiene volumen propio porque lo que guarda
  # —los dibujos— es de otra naturaleza que la base de Ánima I, y su CODEX_HOME
  # también es aparte: son dos procesos distintos hablándole al mismo CLI.
  anima-ii:
    build:
      context: .
      dockerfile: docker/Dockerfile.deposito
    image: anima-ii-deposito:1
    container_name: anima-ii
    environment:
      # El mismo flag y la misma decisión que arriba: son dos procesos y una
      # sola canilla. En 0 el depósito no dibuja, no contesta y no forja con
      # cuenta propia — arma los prompts en `/sobre` y el navegador del jugador
      # los lleva a su modelo. Sigue guardando y repartiendo como siempre.
      ANIMA_CLI_LOCAL: '${ANIMA_CLI_LOCAL:-0}'
    # Sin `ANIMA_CODEX_MODELO` manda el default del depósito (gpt-5.6-luna).
    # No se declara vacía a propósito: el depósito la lee con `??`, así que un
    # valor vacío sería el modelo llamado «» y no «ninguno elegido».
    volumes:
      - datos-ii:/datos
      # Con la canilla cerrada esto monta una carpeta VACÍA del repo: el
      # contenedor no tiene forma de llegar a tu cuenta ni por error. Apuntalo
      # a tu `~/.codex` (en el `.env`) solo si además ponés ANIMA_CLI_LOCAL=1.
      - '${ANIMA_CODEX_SEED:-./docker/sin-semilla}:/semilla/codex:ro'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:5190/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  datos:
  datos-ii:
